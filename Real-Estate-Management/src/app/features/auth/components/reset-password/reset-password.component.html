<div class="login-wrapper">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">◆</div>
      <h1>Reset Password</h1>
      <p>Enter your new password</p>
    </div>

    <div class="alert alert-error" *ngIf="errorMessage">
      <span>!</span> {{ errorMessage }}
    </div>

    <form #resetForm="ngForm" (ngSubmit)="onSubmit(resetForm)" novalidate>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            #newPwd="ngModel"
            required
            minlength="6"
            placeholder="Enter new password"
            [class.input-error]="newPwd.invalid && newPwd.touched"
          />
          <span class="toggle-eye" (click)="togglePasswordVisibility()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </span>
        </div>
        <div class="error-text" *ngIf="newPwd.invalid && newPwd.touched">
          <span *ngIf="newPwd.errors?.['required']">Password is required.</span>
          <span *ngIf="newPwd.errors?.['minlength']">Minimum 6 characters.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            #confirmPwd="ngModel"
            required
            placeholder="Confirm new password"
            [class.input-error]="confirmPwd.invalid && confirmPwd.touched"
          />
        </div>
        <div class="error-text" *ngIf="confirmPwd.invalid && confirmPwd.touched">
          <span *ngIf="confirmPwd.errors?.['required']">Please confirm your password.</span>
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>
  </div>
</div>
