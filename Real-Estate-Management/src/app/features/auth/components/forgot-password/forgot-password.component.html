<div class="login-wrapper">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">◆</div>
      <h1>Forgot Password</h1>
      <p>Enter your email to receive an OTP</p>
    </div>

    <div class="alert alert-error" *ngIf="errorMessage">
      <span>!</span> {{ errorMessage }}
    </div>

    <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" [(ngModel)]="email" #emailRef="ngModel" required email
            placeholder="you@example.com" [readonly]="isEmailPrefilled"
            [class.input-error]="emailRef.invalid && emailRef.touched"
            [style.background]="isEmailPrefilled ? '#f0f0f0' : ''"
            [style.cursor]="isEmailPrefilled ? 'not-allowed' : ''" />
        </div>
        <div class="error-text" *ngIf="emailRef.invalid && emailRef.touched">
          <span *ngIf="emailRef.errors?.['required']">Email is required.</span>
          <span *ngIf="emailRef.errors?.['email']">Enter a valid email address.</span>
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading">
        <span *ngIf="!isLoading">Send OTP</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <p class="register-link">
      Remember your password? <a routerLink="/login">Sign In</a>
    </p>
  </div>
</div>
