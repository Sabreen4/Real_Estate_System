<nav class="topbar">

  <div class="topbar-left">
    <button class="hamburger-btn" (click)="openDrawer()" title="Open menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <div class="topbar-divider"></div>
    <span class="topbar-brand" (click)="goHome()">
      <div class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </div>
      <span class="brand-name">RealEstate</span>
    </span>
  </div>

  <div class="topbar-right">
    <span class="role-chip">
      <span class="role-dot"></span>
      <ng-container *ngIf="role.toUpperCase() === 'AGENT'; else defaultRole">
        Property Consultant
      </ng-container>
      <ng-template #defaultRole>{{ role | titlecase }}</ng-template>
    </span>

    <div class="profile-dropdown-wrapper">

      <button class="avatar-btn" type="button" (click)="toggleDropdown($event)" title="Profile options">
        <span class="avatar">{{ userInitials }}</span>
      </button>

      <!-- stopProp on the dropdown prevents clicks inside from closing it -->
      <div class="profile-dropdown"
           [class.profile-dropdown-visible]="showProfileDropdown"
           (click)="stopProp($event)">
        <div class="pd-arrow"></div>
        <div class="pd-user-info">
          <div class="pd-avatar">{{ userInitials }}</div>
          <div class="pd-details">
            <span class="pd-name">{{ userName }}</span>
            <span class="pd-email">{{ userEmail }}</span>
          </div>
        </div>
        <div class="pd-divider"></div>
        <button class="pd-action" type="button" (click)="openEditModal()">
          <span class="pd-icon pd-edit-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
          </span>
          Edit Profile
        </button>
        <div class="pd-divider"></div>
        <button class="pd-action pd-logout" type="button" (click)="logout()">
          <span class="pd-icon pd-logout-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </span>
          Sign Out
        </button>
      </div>

    </div>
  </div>

</nav>

<!-- Drawer backdrop -->
<div class="drawer-backdrop" [class.backdrop-visible]="drawerOpen" (click)="closeDrawer()"></div>

<!-- Drawer -->
<aside class="drawer" [class.drawer-open]="drawerOpen">
  <div class="drawer-header">
    <div class="dh-brand">
      <div class="brand-icon sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </div>
      <span class="brand-name">RealEstate</span>
    </div>
    <button class="drawer-close" type="button" (click)="closeDrawer()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>
  <div class="drawer-divider"></div>
  <nav class="drawer-nav">
    <p class="nav-section-label">Navigation</p>
    <a *ngFor="let item of menu"
       [routerLink]="item.link"
       routerLinkActive="nav-active"
       class="nav-item"
       (click)="closeDrawer()">
      <span class="nav-icon" [innerHTML]="getSvg(item.icon)"></span>
      <span class="nav-label">{{ item.name }}</span>
    </a>
  </nav>
</aside>

<!-- Edit Profile Modal -->
<div class="modal-overlay" *ngIf="showEditModal" (click)="closeEditModal()">
  <div class="edit-modal" (click)="$event.stopPropagation()">
    <div class="em-header">
      <div class="em-avatar">{{ userInitials }}</div>
      <div>
        <h3 class="em-title">Edit Profile</h3>
        <p class="em-sub">Update your personal information</p>
      </div>
      <button class="em-close" type="button" (click)="closeEditModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="em-body">
      <div class="em-error" *ngIf="editError">{{ editError }}</div>
      <div class="em-row">
        <div class="em-field">
          <label class="em-label">First Name</label>
          <input class="em-input"
                 [value]="editFirstName"
                 (input)="editFirstName = $any($event.target).value"
                 placeholder="First name" />
        </div>
        <div class="em-field">
          <label class="em-label">Last Name</label>
          <input class="em-input"
                 [value]="editLastName"
                 (input)="editLastName = $any($event.target).value"
                 placeholder="Last name" />
        </div>
      </div>
      <div class="em-field">
        <label class="em-label">Phone</label>
        <input class="em-input"
               [value]="editPhone"
               (input)="editPhone = $any($event.target).value"
               placeholder="+91 99999 00000"
               type="tel" />
      </div>
    </div>
    <div class="em-footer">
      <button class="em-btn-cancel" type="button" (click)="closeEditModal()">Cancel</button>
      <button class="em-btn-save" type="button" (click)="saveProfile()" [disabled]="editSaving">
        <span *ngIf="editSaving" class="em-spinner"></span>
        {{ editSaving ? 'Saving…' : 'Save Changes' }}
      </button>
    </div>
  </div>
</div>
