<button
  class="prim-btn"
  [class.prim-btn--primary]="variant === 'primary'"
  [class.prim-btn--danger]="variant === 'danger'"
  [class.prim-btn--secondary]="variant === 'secondary'"
  [disabled]="disabled"
  (click)="onClick()">

  <!-- Plus icon -->
  <svg *ngIf="icon === 'plus'" width="15" height="15" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </svg>

  <!-- Refresh icon -->
  <svg *ngIf="icon === 'refresh'" width="14" height="14" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2">
    <polyline points="23 4 23 10 17 10"/>
    <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
  </svg>

  {{ label }}
</button>
